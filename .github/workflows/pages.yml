# GitHub Pages — static demo UI (no backend)
# Live at: https://smolildn.github.io/memorium/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages for demo data
        run: |
          npm run build --workspace=@memorium/core
          npm run build --workspace=@memorium/demo
          npm run build --workspace=@memorium/ingest

      - name: Generate static demo JSON
        run: node scripts/generate-static-demo.mjs

      - name: Build web app (demo mode)
        run: npm run build --workspace=@memorium/web
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE: /memorium/

      - name: SPA fallback for GitHub Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
