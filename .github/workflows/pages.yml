# GitHub Pages — static demo UI
# Live at: https://smolildn.github.io/memorium/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages for demo data
        run: |
          npm run build --workspace=@memorium/core
          npm run build --workspace=@memorium/demo
          npm run build --workspace=@memorium/ingest

      - name: Generate bundled demo data
        run: node scripts/generate-static-demo.mjs

      - name: Build web app (demo mode)
        run: npm run build --workspace=@memorium/web
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE: /memorium/

      - name: SPA fallback for GitHub Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
          force_orphan: true
